name: Revvity eIFU API audit

on:
  push:
    branches:
      - revvity-api-audit-20260902
    paths:
      - "revvity_api_audit/**"
      - ".github/workflows/revvity-api-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run read-only probe
        run: python revvity_api_audit/probe.py

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: revvity-api-audit
          path: revvity_api_audit/results/
          if-no-files-found: error
          retention-days: 7
